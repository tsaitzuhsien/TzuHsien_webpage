		<div class = "grid_10">
			<article class="poem-box">
				<p>
				昔年共結同窗誼，常樂，笑憑春雨化秋水。<br>
				今夕離別行路遠，易寒，且任新愁煮舊情。
				</p>
				<div class = "poem-title">
					《送友人》丙午夏 2026.08.04
				</div>
			</article>
			<article class="poem-box">
				<p>
				盈窗夏綠清和暑，滿室閒情半卷書。<br>
				</p>
				<div class = "poem-title">
					《午後書房》丙午夏 2026.07.31
				</div>
			</article>
			<article class="poem-box">
				<p>
				君如潔皎織雲線，妾似玲瓏秀翠針。<br>
				穿絹引絲結緊繫，一生一世不離分。
				</p>
				<div class = "poem-title">
					《聽費玉清〈天涯歌女〉有感》乙巳夏 2025.08.16
				</div>
			</article>
		</div>
